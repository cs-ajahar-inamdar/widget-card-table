<div class="widget cardtable-widget-container">
  <div class="cardtable-widget-content">
    <div class="widget-cardview" data-ng-hide="processing || unauthorized">
      <div class="card-table-container">
        <div class="card-table-content">
          <div class="card-table-content-header display-flex-space-between align-items-center">
            <!-- Added title-truncate class and conditional searching class -->
            <h5 class="margin-0 padding-0 font-size-16 text-muted flex-grow-1 title-truncate" 
                data-ng-class="{'is-searching': searchActive}" title="{{ config.title }}">
              {{ config.title }}
            </h5>

            <span id="show-search-button" class="font-size-14 margin-right-lg" data-ng-click="searchActive = true; focusSearchField()" data-ng-hide="searchActive === true">
              <span class="icon icon-search"></span>
            </span>
            <input data-ng-show="searchActive" id="search-{{config.wid}}" data-ng-model="searchText" type="text" placeholder="{{ ::'APP.LABEL.SEARCH' | translate }}" class="grid-filter form-control search-grid margin-right-lg" data-ng-focus="searchActive = true" data-ng-blur="searchActive = false" data-ng-class="(searchActive === true || searchText !== '') ? 'search-expanded fade-in-animation' : 'display-none fade-out-animation'">
            <span class="font-size-14" data-ng-click="getList()">
              <span class="icon icon-refresh" data-ng-class="{'fa fa-spin': processing}"></span>
            </span>
          </div>
            <ul class="margin-0 card-table-content-list">
              <li data-ng-repeat="record in fieldRows | filter:searchFilter" 
                  class="list-unstyled" 
                  data-ng-class="{'active': selectedIndex === $index}">
                  
                <a href data-ng-click="actions.onView(record); $parent.selectedIndex = $index" data-ng-blur="$parent.selectedIndex = null"
                  class="display-flex-space-between text-decoration-none font-size-14">
                  <span>{{record.displayValue || ('APP.LABEL.NONE' | translate)}}</span>
                  <span data-ng-bind="record['total']"></span>
                </a>
              </li>
          </ul>
        </div>
      </div>
    </div>
    <div data-ng-show="processing">
      <cs-spinner data-ng-hide="unauthorized" data-show-background="true"></cs-spinner>
    </div>
    <div data-ng-show="processing || unauthorized" class="unauthorized-message">
      <h6 data-ng-show="unauthorized" class="text-center padding-top-md padding-bottom-md font200 font-size-15">{{'APP.MESSAGE.NECESSARY_PERMISSION_MSG' | translate: { 'resourceName': (config.resource | titlecase) } }}</h6>
    </div>
  </div>
</div>
