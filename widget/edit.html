<form data-ng-submit="save()" class="noMargin" name="cardCountForm" data-ng-class="{'state-wait': processing }" novalidate>
  <div class="modal-header">
    <h3 class="modal-title col-md-9" data-ng-bind="::header"></h3>
    <button type="button" class="close" data-ng-click="cancel()" data-dismiss="modal" aria-label="Close" id="close-edit-card-count-btn">
      <div aria-hidden="true" class="version-button">+</div>
    </button>
  </div>
  <div class="modal-body">
    <div class="form-group" data-ng-class="{ 'has-error': cardCountForm.title.$invalid && cardCountForm.title.$touched }">
      <label for="title" class="control-label">{{ ::'COMPONENTS.VIEW_TEMPLATES.WIDGETS.CHART.TITLE' | translate }}<span class="text-danger">*</span></label>
      <input id="title" name="title" type="text" class="form-control" data-ng-model="config.title" required>
      <div data-cs-messages="cardCountForm.title"></div>
    </div>
    <div class="form-group" data-ng-class="{ 'has-error': cardCountForm.resource.$invalid && cardCountForm.resource.$touched }" data-ng-if="modules || playbookModules">
      <label for="resource" class="control-label">{{ ::'COMPONENTS.VIEW_TEMPLATES.WIDGETS.CHART.DATA_SOURCE' | translate }}<span class="text-danger">*</span></label>
      <select name="resource" id="resource" class="form-control" data-ng-options="module.type as module.name for module in modules | playbookModules" data-ng-model="config.resource" required data-ng-change="loadAttributes()">
        <option value="">{{ ::'APP.LABEL.SELECT_AN_OPTION' | translate }}</option>
      </select>
      <div data-cs-messages="cardCountForm.resource"></div>
    </div>
    <div data-ng-show="config.resource" data-ng-repeat="mappingField in aggregateDefinitions['model'].mappingFields">
      <div class="form-group" data-ng-class="{ 'has-error': cardCountForm[mappingField.name].$invalid && cardCountForm[mappingField.name].$touched }">
        <label for="{{ mappingField.name }}" class="control-label">{{ mappingField.title }}<span class="text-danger">*</span></label>
        <select name="{{ mappingField.name }}" id="{{ mappingField.name }}" class="form-control" required data-ng-model="config.mapping[mappingField.name]" data-ng-options="field.name as field.title for field in fieldsArray | filter: groupByFilter | orderBy: 'title'"></select>
        <div data-cs-messages="cardCountForm[mappingField.name]"></div>
        <div data-ng-show="config.resource && getFieldCount(fieldsArray, mappingField) < 1" class="text-danger">
          <span>{{ ::'COMPONENTS.VIEW_TEMPLATES.WIDGETS.LISTS.COMPLETE_THIS_WIDGET' | translate }}</span>
        </div>
      </div>
    </div>
    <div class="form-group" data-ng-if="config.resource">
      <label for="maxRecordSize" class="control-label">{{ ::'COMPONENTS.VIEW_TEMPLATES.WIDGETS.FORM_GROUP.MAX_RECORD_LIMIT' | translate }}</label>
      <select name="maxRecordSize" id="maxRecordSize" class="form-control" style="width:30%" ng-options="size for size in pageConfig.maxRecordSize" ng-model="config.query.limit" required></select>
    </div>
    <div class="row">
      <div class="col-sm-6">
        <div class="form-group">
          <label class="control-label" for="assignedToSetting">{{ ::'COMPONENTS.VIEW_TEMPLATES.WIDGETS.CHART.RECORD_ASSIGNMENT' | translate }}</label>
          <select class="form-control" name="assignedToSetting" id="assignedToSetting" ng-model="config.assignedToSetting">
            <option value="onlyMe">{{ ::'COMPONENTS.VIEW_TEMPLATES.WIDGETS.CHART.ONLY_ME' | translate }}</option>
            <option value="all">{{ ::'APP.LABEL.ALL' | translate }}</option>
          </select>
        </div>
      </div>
      <div class="col-sm-6">
        <div class="form-group">
          <label class="control-label" for="assignmentField">{{ ::'COMPONENTS.VIEW_TEMPLATES.WIDGETS.CHART.ASSIGNMENT_FIELD' | translate }}</label>
          <select class="form-control" name="assignmentField" id="assignmentField" data-ng-options="field.name as field.title for field in userField | orderBy: 'title'" ng-model="config.mapping.assignedToPerson">
            <option value="">{{ ::'COMPONENTS.FILTER.CONDITIONAL.SELECT_A_FIELD' | translate }}</option>
          </select>
        </div>
      </div>
    </div>
    <div data-ng-show="config.resource" class="col-lg-12 col-md-12 col-sm-12 navbar-inverse margin-bottom-md margin-top-xlg">
      <h6>{{ ::'COMPONENTS.GRID.QUERY.FILTER_CRITERIA' | translate }}</h6>
    </div>
    <div data-ng-hide="!fieldsArray || fieldsArray.length === 0">
      <div class="form-group" data-ng-class="{ 'has-error': cardCountForm.filters.$invalid && cardCountForm.filters.$touched }">
        <div data-cs-conditional data-ng-if="fieldsArray.length > 0" data-fields="$parent.fields" data-reset-field="$parent.fields" data-mode="'queryFilters'" data-ng-model="$parent.config.query" data-parent-form="cardCountForm"
        data-enable-expression="(page==='dashboard' || page==='reporting')" data-show-uuid="true" data-form-name="'cardCountForm'"></div>
        <div data-cs-messages="cardCountForm.filters"></div>
      </div>
    </div>
  </div>
  <div class="modal-footer">
    <button id="widget-edit-save" type="submit" class="btn btn-sm btn-primary"><i class="icon icon-check margin-right-sm"></i>{{ ::'APP.BUTTON.SAVE' | translate }}</button>
    <button id="widget-edit-cancel" type="button" class="btn btn-sm btn-default" data-ng-click="cancel()"><i class="icon icon-close margin-right-sm"></i>{{ ::'APP.LABEL.CLOSE' | translate }}</button>
  </div>
</form>
